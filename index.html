<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanaullah Education - لاگ ان اور رجسٹریشن</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ہوم پیج کا مرکزی سیکشن -->
    <header class="main-header">
        <h1>Sanaullah Education میں خوش آمدید</h1>
        <p>اپنے تعلیمی سفر کا آغاز کریں اور ہمارے ساتھ جڑیں</p>
        <div class="auth-buttons">
            <button class="btn-primary" data-open-auth="register">نیا اکاؤنٹ بنائیں (Sign Up)</button>
            <button class="btn-secondary" data-open-auth="login">لاگ ان کریں (Sign In)</button>
        </div>
    </header>

    <!-- اتھینٹیکیشن ماڈل (مخفی ونڈو) -->
    <div id="authModal" class="modal-overlay">
        <div class="modal-container">
            <button class="close-btn" data-close-modal>&times;</button>
            <h2 id="authTitle">Create Account</h2>
            
            <form id="authForm">
                <!-- صرف رجسٹریشن کے لیے فیلڈز -->
                <div id="nameField" class="form-group">
                    <label for="fullName">पूरा नाम (Full Name)</label>
                    <input type="text" id="fullName" placeholder="अपना पूरा नाम दर्ज करें">
                </div>

                <div id="fatherField" class="form-group">
                    <label for="fatherName">والد کا نام (Father's Name)</label>
                    <input type="text" id="fatherName" placeholder="والد کا نام درج کریں">
                </div>

                <div class="form-group">
                    <label for="email">ای میل (Email Address)</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="password">پاس ورڈ (Password)</label>
                    <input type="password" id="password" required placeholder="कम से कम 6 حروف">
                </div>

                <div id="confirmPasswordField" class="form-group">
                    <label for="confirmPassword">پاس ورڈ کی تصدیق (Confirm Password)</label>
                    <input type="password" id="confirmPassword" placeholder="پاس ورڈ دوبارہ درج کریں">
                </div>

                <button type="submit" id="authSubmitBtn" class="btn-submit">Sign Up</button>
            </form>

            <div id="authSwitch" class="auth-switch">
                Already have an account? <button type="button" data-switch-auth="login">Login</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
