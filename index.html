<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScaleFlow University - Student Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= AUTH CONTAINER ================= -->
  <div class="auth-container" id="authContainer">
    
    <!-- Diagonal Background Overlay -->
    <div class="diagonal-overlay"></div>

    <!-- Left Text Panel -->
    <div class="yellow-text-panel">
      <h1>WELCOME TO<br>SCALEFLOW<br>UNIVERSITY</h1>
      <p style="margin-top: 15px; font-size: 14px; opacity: 0.9;">تعلیمی نظام کا جدید اور محفوظ پلیٹ فارم</p>
    </div>

    <!-- Right Form Panel -->
    <div class="white-form-panel">
      
      <!-- SIGN UP FORM BOX -->
      <div class="form-content" id="signUpFormBox">
        <h2 class="form-title">Sign Up</h2>
        
        <form id="regForm">
          <div class="input-group">
            <input type="text" id="regFullName" placeholder="Full Name (پورا نام)" required />
          </div>

          <div class="input-group">
            <input type="text" id="regFatherName" placeholder="Father's Name (والد کا نام)" required />
          </div>

          <div class="input-group">
            <input type="email" id="regEmail" placeholder="Email (ای میل)" required />
          </div>

          <div class="input-group">
            <input type="password" id="regPassword" placeholder="Password (پاس ورڈ)" required />
          </div>

          <button type="submit" class="action-btn">Sign Up</button>
        </form>

        <p class="toggle-link">Already have an account? <span id="goToLogin">Login</span></p>
      </div>

      <!-- LOGIN FORM BOX -->
      <div class="form-content" id="loginFormBox" style="display: none;">
        <h2 class="form-title">Login</h2>
        
        <form id="loginForm">
          <div class="input-group">
            <input type="email" id="loginEmail" placeholder="Email (ای میل)" required />
          </div>

          <div class="input-group">
            <input type="password" id="loginPassword" placeholder="Password (پاس ورڈ)" required />
          </div>

          <button type="submit" class="action-btn">Login</button>
        </form>

        <p class="toggle-link">Don't have an account? <span id="goToSignUp">Sign Up</span></p>
      </div>

    </div>
  </div>

  <!-- ================= DASHBOARD ================= -->
  <div class="website-dashboard" id="mainDashboard">
    <div class="navbar">
      <h1>SCALEFLOW UNIVERSITY</h1>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
    <div class="dashboard-content">
      <div class="dashboard-card">
        <h2>Welcome to ScaleFlow University!</h2>
        <p id="userEmailDisplay" style="margin-top: 10px; color: #666;"></p>
        <p style="margin-top: 15px; color: #333; font-weight: 500;">آپ کا اکاؤنٹ کامیابی سے لاگ ان / رجسٹر ہو چکا ہے۔</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
