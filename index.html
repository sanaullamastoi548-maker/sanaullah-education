<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanaullah Education - Student Portal</title>

<!-- فونٹس اور آئیکنز -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- CSS فائل کا لنک -->
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- نوٹیفیکیشن ٹوسٹ -->
<div id="customToast" class="toast-notification">
    <span id="toastMessage">کامیاب!</span>
</div>

<!-- لاگ ان اور رجسٹر فارم -->
<div class="auth-container" id="authContainer">
    <div class="diagonal-overlay"></div>

    <section class="form-box login-box">
        <h1>WELCOME<br>BACK!</h1>
        <p>Sanaullah Education پورٹل میں خوش آمدید۔</p>
        <h2>LOGIN</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="ای میل درج کریں" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="پاسورڈ درج کریں" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <p style="margin-top:15px; font-size:12px;">نیا اکاؤنٹ بنانا ہے؟ <button type="button" class="switch-btn" id="toRegister">Register Now</button></p>
    </section>

    <section class="form-box register-box">
        <h2>REGISTER</h2>
        <form id="regForm">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="regFullName" placeholder="پورا نام" required>
            </div>
            <div class="input-group">
                <label>Father Name</label>
                <input type="text" id="regFatherName" placeholder="والد کا نام" required>
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="ای میل" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="پاسورڈ" required>
            </div>
            <button type="submit" class="btn" id="signUpBtnText">Register Now</button>
        </form>
        <p style="margin-top:15px; font-size:12px;">پہلے سے اکاؤنٹ ہے؟ <button type="button" class="switch-btn" id="toLogin">Login</button></p>
    </section>
</div>

<!-- شاندار ڈیش بورڈ (اسکرین شاٹ جیسا) -->
<div class="website-dashboard" id="mainDashboard">
    
    <header class="dash-header">
        <div class="dash-logo-area">
            <div class="dash-logo-icon">📖</div>
            <div class="dash-logo-text">
                <h1>SANAULLAH EDUCATION</h1>
            </div>
        </div>
        <div class="dash-header-right">
            <button class="lang-dropdown-btn">
                <i class="fa-solid fa-globe"></i> English <i class="fa-solid fa-chevron-down" style="font-size:10px;"></i>
            </button>
            <button class="profile-avatar-btn" id="logoutBtn" title="لاگ آؤٹ / Logout">
                <i class="fa-solid fa-user"></i>
            </button>
        </div>
    </header>

    <div class="dash-main-container">
        <div class="hero-banner">
            <div class="hero-text">
                <h2>Welcome to Sanaullah Education</h2>
                <p id="userEmailDisplay">Logged in as: student@example.com</p>
                <span class="hero-tagline">Learn &bull; Grow &bull; Build a Better Future</span>
            </div>
            <div class="hero-icon-graphic" style="font-size: 50px;">🎓</div>
        </div>

        <div class="subject-filter-buttons"></div>
        <div id="mediaContainer"></div>
    </div>
</div>

<!-- جاوا اسکرپٹ فائل کا لنک -->
<script src="script.js"></script>

</body>
</html>
