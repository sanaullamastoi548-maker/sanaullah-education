<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanaullah Education - Student Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- زبان تبدیل کرنے کا بٹن (Language Switcher) -->
  <div class="lang-switcher">
    <button id="langToggleBtn" class="lang-btn">English</button>
  </div>

  <!-- خوبصورت نوٹیفیکیشن باکس -->
  <div id="customToast" class="toast-notification">
    <span id="toastMessage">Successfully completed!</span>
  </div>

  <!-- ================= AUTH CONTAINER (لاگ ان / رجسٹر فارم) ================= -->
  <div class="auth-container" id="authContainer">
    
    <!-- Left Text Panel -->
    <div class="text-panel" id="textPanel">
      <h1 id="brandTitle">WELCOME TO<br>SANAULLAH<br>EDUCATION</h1>
      <p id="brandSubtitle" style="margin-top: 15px; font-size: 14px; opacity: 0.9;">تعلیمی نظام کا جدید اور محفوظ پلیٹ فارم</p>
    </div>

    <!-- Right Form Panel -->
    <div class="form-panel" id="formPanel">
      
      <!-- SIGN UP FORM BOX -->
      <div class="form-content" id="signUpFormBox">
        <h2 class="form-title" id="signUpTitle">Sign Up</h2>
        
        <form id="regForm">
          <div class="input-group">
            <input type="text" id="regFullName" placeholder="Full Name (پورا نام)" required />
          </div>

          <div class="input-group">
            <input type="text" id="regFatherName" placeholder="Father's Name (والد کا نام)" required />
          </div>

          <div class="input-group">
            <input type="email" id="regEmail" placeholder="Email (ای میل)" required />
          </div>

          <div class="input-group">
            <input type="password" id="regPassword" placeholder="Password (پاس ورڈ)" required />
          </div>

          <button type="submit" class="action-btn" id="signUpBtnText">Sign Up</button>
        </form>

        <p class="toggle-link"><span id="hasAccountText">Already have an account?</span> <span id="goToLogin">Login</span></p>
      </div>

      <!-- LOGIN FORM BOX -->
      <div class="form-content" id="loginFormBox" style="display: none;">
        <h2 class="form-title" id="loginTitle">Login</h2>
        
        <form id="loginForm">
          <div class="input-group">
            <input type="email" id="loginEmail" placeholder="Email (ای میل)" required />
          </div>

          <div class="input-group">
            <input type="password" id="loginPassword" placeholder="Password (پاس ورڈ)" required />
          </div>

          <button type="submit" class="action-btn" id="loginBtnText">Login</button>
        </form>

        <p class="toggle-link"><span id="noAccountText">Don't have an account?</span> <span id="goToSignUp">Sign Up</span></p>
      </div>

    </div>
  </div>

  <!-- ================= DASHBOARD (ویڈیو، آڈیو اور تصاویر والا صفحہ) ================= -->
  <div class="website-dashboard" id="mainDashboard">
    <div class="navbar" id="dashNavbar">
      <h1 id="dashBrand">SANAULLAH EDUCATION</h1>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>

    <div class="dashboard-content">
      <!-- ویلکم کارڈ -->
      <div class="dashboard-card">
        <h2 id="dashWelcome">Welcome to Sanaullah Education!</h2>
        <p id="userEmailDisplay" style="margin-top: 10px; color: #666;"></p>
        <p id="dashSubText" style="margin-top: 10px; color: #333; font-weight: 500;">آپ کا اکاؤنٹ کامیابی سے لاگ ان / رجسٹر ہو چکا ہے۔</p>
      </div>

      <!-- مضمون / زبان فلٹر کرنے کے بٹن -->
      <div class="subject-filter-buttons" style="text-align: center; margin: 25px 0;">
        <button onclick="filterMedia('All')">سب / All</button>
        <button onclick="filterMedia('English')">English</button>
        <button onclick="filterMedia('اردو')">اردو</button>
        <button onclick="filterMedia('عربی قائدہ')">عربی قائدہ</button>
        <button onclick="filterMedia('سنڌھي')">سنڌھي</button>
      </div>

      <!-- تصاویر، وائس اور ویڈیوز دکھانے والا مین باکس -->
      <div id="mediaContainer">
        <!-- جاوا اسکرپٹ گوگل شیٹ سے تمام ویڈیوز اور امیجز خود بخود یہاں لوڈ کرے گی -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
